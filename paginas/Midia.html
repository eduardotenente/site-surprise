    <script>
        const myObserver = new IntersectionObserver( (entries) => {
            entries.forEach( (entry) => {
                if (entry.isIntersecting){
                    entry.target.classList.add('show')
                } else {
                    entry.target.classList.remove('show')
                }
            })
        })
        const elements = document.querySelectorAll('.scroll-container')
        elements.forEach( (element) => myObserver.observe(element))

        const scrollContent = document.getElementsByClassName('scrollContent');
        const images = scrollContent.innerHTML;
        scrollContent.innerHTML += images; //Duplica imagens

        const audio = document.getElementById("CultMembers");
        const inicio = 1;
        const fim = 174;
        audio.addEventListener("loadedmetadata", () => {
        audio.currentTime = inicio
        function controlarFim() {
            if (audio.currentTime >= fim) {
            audio.pause();
            audio.removeEventListener("timeupdate", controlarFim);
            }
        }
        audio.addEventListener("timeupdate", controlarFim);
        // Tenta desmutar depois de iniciar
        audio.muted = false;
        });
    </script>
