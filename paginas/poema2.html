<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Sekuya&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_top_left"/>
    <link rel="shortcut icon" href="../imagens/favicon_io/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../estilos/poema.css">
    <title>Parte 2!</title>
    <style>
        body {
            background: black url(../imagens/GIF-Imagens-Poema/parte2/parte2.gif) center center no-repeat fixed;
            transition: .5s ease-in-out;
        }
        section {
            width: 450px;
            margin-left: 0%;
        }

        h1, h2 {
            text-shadow: 3px 3px 3px black;
        }

        h2 {
            font-size: 1em;
        }

        button#voltar {
            border-color: rgb(255, 61, 119);

            &:hover {
                background: rgb(255, 61, 119);
                box-shadow: 0 0 30px 8px rgba(236, 0, 79, 0.815);
            }
        }

        @media screen and (min-width: 767px) {
            body {
                background-image: url(../imagens/GIF-Imagens-Poema/parte2/dança-parte2.gif);
            }

            #GIF {
                left: -7%;
            }

            h1:hover::after {
                width: 35%;
            }

            section {
                width: 550px;
            }

            h2 {
                font-size: 1.4em;
            }

            @media screen and (min-width: 992px) {
                #GIF {
                    top: 20%;
                    left: -4%;
                }
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Parte 2!</h1>
    </header>
    <main>
        <section id="parte2">
            <h2>Meu amor por você é eterno</h2>
            <h2>Sinto o domínio sempiterno.</h2>
            <h2>Debaixo do céu estrelado</h2>
            <h2>Sinto sua alma ao meu lado.</h2>
        </section>
    </main>
    <div id="botoes">
        <abbr title="Eu!">
            <a href="poema.html" target="_self" rel="prev">
                <button id="voltar" class="merriweather">
                    <span class="material-symbols-outlined">
                        arrow_top_left
                    </span> Voltar
                </button>
            </a>
        </abbr>
        <abbr title="Você!">
            <a href="poema3.html" target="_self" rel="next">
                <button id="avançar" class="merriweather">
                    Parte 3
                </button>
            </a>
        </abbr>
        <audio id="Lilacs" autoplay muted>
            <source src="../audio/LILACS_-_PASTEL_GHOST_sped_up_mp3.mp3" type="audio/mp3">
        </audio>
    </div>
    <section id="GIF">
        <img src="../imagens/GIF-Imagens-Poema/parte2/mizi.gif" alt="Mizi Corada" id="coração">
    </section>

    <script>
        const audio = document.getElementById("Lilacs");
        const inicio = 28;
        const fim = 55;
        audio.addEventListener("loadedmetadata", () => {
        audio.currentTime = inicio

        function controlarFim() {
            if (audio.currentTime >= fim) {
            audio.pause();
            audio.removeEventListener("timeupdate", controlarFim);
            }
        }
        audio.addEventListener("timeupdate", controlarFim);

        // Tenta desmutar depois de iniciar
        audio.muted = false;
        });
    </script>
</body>
</html>
