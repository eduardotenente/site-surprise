    <script>
        function fundo() {
            let fundo = document.getElementById('fundojs')
            let retorno = document.getElementById('retorno')
            fundo.style.display = 'none'
            retorno.style.opacity = 1
        }

        function retornar() {
            let fundo = document.getElementById('fundojs')
            fundo.style.display = 'block'
        }

        const audio = document.getElementById("Lamour");
        const inicio = 1;
        const fim = 217;
        audio.addEventListener("loadedmetadata", () => {
        audio.currentTime = inicio

        function controlarFim() {
            if (audio.currentTime >= fim) {
            audio.pause();
            audio.removeEventListener("timeupdate", controlarFim);
            }
        }
        audio.addEventListener("timeupdate", controlarFim);

        // Tenta desmutar depois de iniciar
        audio.muted = false;
        });
    </script>
