<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Sekuya&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_top_left"/>
    <link rel="shortcut icon" href="../imagens/favicon_io/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../estilos/poema.css">
    <link rel="stylesheet" href="../estilos/transiçao-poema.css">
    <title>Parte 4!</title>
    <style>
        section {
            width: 480px;
            margin-left: 0%;
            margin-top: 5%;
            margin-bottom: 0px;
        }

        h1, h2, abbr, button {
            text-shadow: 2px 2px 2px rgba(0, 0, 0, 0.829);
        }

        h2 {
            font-size: 1em;
        }

        img {
            width: 430px;
            height: 300px;
            opacity: 1;
            transition: .5s;
        }

        @keyframes slide-top {
            0% {
                transform: translateY(100px);
                display: none;
            }
            100% {
                transform: translateY(-80px);
            }
        }

        #voltar {
            margin-top: -5%;
        }

        #avançar {
            border-color: rgb(255, 61, 119);
            margin-top: -3%;

            &:hover {
                background: rgb(255, 61, 119);
                box-shadow: 0 0 30px 8px rgba(236, 0, 79, 0.815);
            }
        }

        @media screen and (min-width: 767px) {
            body {
                background: black url(../imagens/GIF-Imagens-Poema/parte4/espectros.gif) center center no-repeat fixed;
                background-size: cover;
            }

            #parte4 {
                width: 605px;
            }

            img {
                opacity: 0;
            }

            main {
                margin-top: -20%;
            }

            h2 {
                font-size: 1.3em;
            }

            h1:hover::after {
                width: 35%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Parte 4!</h1>
    </header>
    <main>
        <abbr title="Nós no Espaço-Tempo!"><img src="../imagens/GIF-Imagens-Poema/parte4/parte4.gif" alt="Homem e Mulher no Espaço"></abbr>
        <section id="parte4">
            <h2>Te vejo brilhante</h2>
            <h2>Tu és fascinante.</h2>
            <h2>Além do tempo, estamos nós</h2>
            <h2>No espaço - tempo, a sós.</h2>
            <br>
            <abbr title="Shiiiryu / Nana">
                <p>- S.N</p>
            </abbr>
        </section>
    </main>
    <div id="botoes">
        <a href="poema3.html" target="_self" rel="prev">
            <button id="voltar" class="merriweather">
                <span class="material-symbols-outlined">
                    arrow_top_left
                </span> Voltar
            </button>
        </a>
        <a href="poemacompleto.html" target="_self" rel="next">
            <button id="avançar" class="merriweather">
                Poema Completo!
            </button>
        </a>
        <audio id="Lilacs" autoplay muted>
            <source src="../audio/LILACS_-_PASTEL_GHOST_sped_up_mp3.mp3" type="audio/mp3">
        </audio>
    </div>

    <script>
        const audio = document.getElementById("Lilacs");
        const inicio = 70;
        const fim = 95;
        audio.addEventListener("loadedmetadata", () => {
        audio.currentTime = inicio

        function controlarFim() {
            if (audio.currentTime >= fim) {
            audio.pause();
            audio.removeEventListener("timeupdate", controlarFim);
            }
        }
        audio.addEventListener("timeupdate", controlarFim);

        // Tenta desmutar depois de iniciar
        audio.muted = false;
        });
    </script>
</body>
</html>
