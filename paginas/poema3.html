<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Sekuya&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_top_left"/>
    <link rel="shortcut icon" href="../imagens/favicon_io/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../estilos/poema.css">
    <link rel="stylesheet" href="../estilos/transiçao-poema.css">
    <title>Parte 3!</title>
    <style>
        section {
            width: 480px;
            margin-left: 0%;
            margin-top: 5%;
            margin-bottom: 0px;
            text-align: center;
        }

        h1, h2 {
            text-shadow: 2px 2px 2px rgba(0, 0, 0, 0.829);
        }

        h2 {
            font-size: 1.2em;
        }

        @keyframes slide-top {
            0% {
                transform: translateY(100px);
                display: none;
            }
            100% {
                transform: translateY(-60px);
            }
        }

        img {
            width: 440px;
            opacity: 1;
            transition: .5s;
        }

        button {
            border-color: #F9F9F5;
            text-shadow: none;
            &:hover {
                background: #F9F9F5;
                box-shadow: 0 0 30px 5px #d6d6d6c7;
                color: black;
            }
        }

        @media screen and (min-width: 767px) {
            body {
                background: black url(../imagens/GIF-Imagens-Poema/parte3/sakura-lua.gif) no-repeat center center fixed;
                background-size: cover;
            }
            h1:hover::after {
                width: 35%;
            }

            #parte3 {
                width: 755px;
            }

            section {
                margin-top: -10%;
            }

            h2 {
                font-size: 1.4em;
            }

            img {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Parte 3!</h1>
    </header>
    <main>
        <abbr title="Você!"><img src="../imagens/GIF-Imagens-Poema/parte3/parte3.gif" alt="anjo"></abbr>
        <section id="parte3">
            <h2>Memórias sendo criadas</h2>
            <h2>Você aparenta asas.</h2>
            <h2>Sinto você nas ruas, nas músicas</h2>
            <h2>Claro, você é tão única!</h2>
        </section>
    </main>
    <div id="botoes">
        <a href="poema2.html" target="_self" rel="prev">
            <button id="voltar" class="merriweather">
                <span class="material-symbols-outlined">
                    arrow_top_left
                </span> Voltar
            </button>
        </a>
        <a href="poema4.html" target="_self" rel="next">
            <button id="avançar" class="merriweather">
                Parte 4!
            </button>
        </a>
        <audio id="Lilacs" autoplay muted>
            <source src="../audio/LILACS_-_PASTEL_GHOST_sped_up_mp3.mp3" type="audio/mp3">
        </audio>
    </div>

    <script>
        const audio = document.getElementById("Lilacs");
        const inicio = 55;
        const fim = 70;
        audio.addEventListener("loadedmetadata", () => {
        audio.currentTime = inicio

        function controlarFim() {
            if (audio.currentTime >= fim) {
            audio.pause();
            audio.removeEventListener("timeupdate", controlarFim);
            }
        }
        audio.addEventListener("timeupdate", controlarFim);

        // Tenta desmutar depois de iniciar
        audio.muted = false;
        });
    </script>
</body>
</html>
